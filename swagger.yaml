openapi: 3.0.3

info:
  title: Instaleap Task API
  version: 1.0.0
  description: |
    API REST para el registro y autenticación de usuarios y la gestión de
    tareas personales.

    ### Autenticación
    1. Registra un usuario con `POST /auth/register`.
    2. Inicia sesión con `POST /auth/login` para obtener un JWT.
    3. Pulsa **Authorize** en Swagger UI e introduce el token JWT; Swagger UI
       añade el prefijo `Bearer` automáticamente. También puedes enviar la
       cabecera `Authorization: Bearer <token>` directamente.

    Cada usuario solo puede consultar, actualizar y eliminar sus propias
    tareas. Las operaciones sobre tareas de otro usuario responden `404`.
  contact:
    name: Equipo Backend
    email: backend@example.com

servers:
  - url: https://instaleap-task.onrender.com
    description: Servidor en la nube (Render)
  - url: http://localhost:3000
    description: Servidor local

tags:
  - name: Auth
    description: Registro e inicio de sesión.
  - name: Tasks
    description: Gestión de tareas. Requiere autenticación Bearer.

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Registrar un usuario
      description: Crea un usuario nuevo y devuelve sus datos públicos.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              nombre: Ana Pérez
              email: ana.perez@example.com
              password: 'Password123!'
      responses:
        '201':
          description: Usuario creado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                success: true
                data:
                  id: 1
                  nombre: Ana Pérez
                  email: ana.perez@example.com
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesión
      description: Valida las credenciales y devuelve un JWT para las rutas protegidas.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ana.perez@example.com
              password: 'Password123!'
      responses:
        '200':
          description: Autenticación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                success: true
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciales inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: Credenciales inválidas.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks:
    post:
      tags:
        - Tasks
      summary: Crear una tarea
      description: |
        Crea una tarea asociada al usuario autenticado. Si no se envía
        `estado`, la tarea se crea con el valor `pendiente`.
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              titulo: Preparar informe mensual
              descripcion: Incluir métricas del sprint y riesgos.
              fecha_vencimiento: '2026-11-05'
              estado: pendiente
      responses:
        '201':
          description: Tarea creada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
              example:
                success: true
                data:
                  id: 10
                  titulo: Preparar informe mensual
                  descripcion: Incluir métricas del sprint y riesgos.
                  fecha_vencimiento: '2026-11-05'
                  estado: pendiente
                  user_id: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Tasks
      summary: Listar tareas
      description: Devuelve las tareas del usuario autenticado, ordenadas por ID descendente.
      operationId: listTasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de tareas del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
              example:
                success: true
                data:
                  - id: 10
                    titulo: Preparar informe mensual
                    descripcion: Incluir métricas del sprint y riesgos.
                    fecha_vencimiento: '2026-11-05'
                    estado: pendiente
                    user_id: 1
                  - id: 9
                    titulo: Actualizar documentación
                    descripcion: null
                    fecha_vencimiento: null
                    estado: completada
                    user_id: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'

    get:
      tags:
        - Tasks
      summary: Obtener una tarea
      description: Devuelve una tarea del usuario autenticado.
      operationId: getTask
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tarea encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
              example:
                success: true
                data:
                  id: 10
                  titulo: Preparar informe mensual
                  descripcion: Incluir métricas del sprint y riesgos.
                  fecha_vencimiento: '2026-11-05'
                  estado: pendiente
                  user_id: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Tasks
      summary: Actualizar una tarea
      description: |
        Actualiza parcialmente una tarea del usuario autenticado. Debe enviarse
        al menos un campo; los campos omitidos conservan su valor actual.
      operationId: updateTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
            example:
              estado: completada
      responses:
        '200':
          description: Tarea actualizada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
              example:
                success: true
                data:
                  id: 10
                  titulo: Preparar informe mensual
                  descripcion: Incluir métricas del sprint y riesgos.
                  fecha_vencimiento: '2026-11-05'
                  estado: completada
                  user_id: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Tasks
      summary: Eliminar una tarea
      description: Elimina una tarea del usuario autenticado.
      operationId: deleteTask
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Tarea eliminada correctamente. No se devuelve cuerpo.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT firmado con HS256. Obtén el token en `POST /auth/login` y envíalo
        como `Authorization: Bearer <token>`. En Swagger UI, pega únicamente
        el token en el diálogo Authorize.

  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: ID numérico de la tarea.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 10

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - nombre
        - email
        - password
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
          pattern: '\S'
          description: Debe contener al menos un carácter no blanco.
          example: Ana Pérez
        email:
          type: string
          format: email
          maxLength: 255
          example: ana.perez@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Contraseña en texto plano. Se almacena como hash bcrypt; máximo 72 bytes UTF-8.

    RegisterResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/RegisteredUser'

    RegisteredUser:
      type: object
      required:
        - id
        - nombre
        - email
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        nombre:
          type: string
          example: Ana Pérez
        email:
          type: string
          format: email
          example: ana.perez@example.com

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: ana.perez@example.com
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          writeOnly: true
          example: 'Password123!'

    LoginResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          required:
            - token
          properties:
            token:
              type: string
              description: JWT que debe enviarse en la cabecera Authorization.
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    TaskStatus:
      type: string
      enum:
        - pendiente
        - en curso
        - completada
      example: pendiente

    Task:
      type: object
      required:
        - id
        - titulo
        - descripcion
        - fecha_vencimiento
        - estado
        - user_id
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 10
        titulo:
          type: string
          minLength: 1
          maxLength: 150
          example: Preparar informe mensual
        descripcion:
          type: string
          maxLength: 5000
          nullable: true
          example: Incluir métricas del sprint y riesgos.
        fecha_vencimiento:
          type: string
          format: date
          nullable: true
          example: '2026-11-05'
        estado:
          $ref: '#/components/schemas/TaskStatus'
        user_id:
          type: integer
          format: int64
          readOnly: true
          example: 1

    CreateTaskRequest:
      type: object
      additionalProperties: false
      required:
        - titulo
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 150
          pattern: '\S'
          description: Debe contener al menos un carácter no blanco.
          example: Preparar informe mensual
        descripcion:
          type: string
          maxLength: 5000
          nullable: true
          example: Incluir métricas del sprint y riesgos.
        fecha_vencimiento:
          type: string
          format: date
          nullable: true
          example: '2026-11-05'
        estado:
          type: string
          enum:
            - pendiente
            - en curso
            - completada
          default: pendiente
          example: pendiente

    UpdateTaskRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Envía al menos uno de los campos. Los campos omitidos no se modifican.
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 150
          pattern: '\S'
          description: Debe contener al menos un carácter no blanco.
          example: Preparar informe mensual
        descripcion:
          type: string
          maxLength: 5000
          nullable: true
          example: Incluir métricas del sprint y riesgos.
        fecha_vencimiento:
          type: string
          format: date
          nullable: true
          example: '2026-11-05'
        estado:
          $ref: '#/components/schemas/TaskStatus'

    TaskResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/Task'

    TaskListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    ValidationErrorDetail:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: titulo
        message:
          type: string
          example: must have required property 'titulo'

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Código estable de error para que el cliente pueda manejarlo.
              example: BAD_REQUEST
            message:
              type: string
              description: Mensaje legible para humanos.
              example: Datos de tarea inválidos.
            details:
              type: array
              nullable: true
              description: Detalles de validación, cuando están disponibles.
              items:
                $ref: '#/components/schemas/ValidationErrorDetail'

  responses:
    BadRequest:
      description: Cuerpo inválido, JSON mal formado o ID de tarea inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: BAD_REQUEST
              message: Datos de tarea inválidos.
              details:
                - field: titulo
                  message: must have required property 'titulo'

    Unauthorized:
      description: Token Bearer ausente, inválido o expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Token no proporcionado

    NotFound:
      description: La tarea no existe o pertenece a otro usuario.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Tarea no encontrada.

    Conflict:
      description: El email ya está registrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CONFLICT
              message: El email ya está registrado.

    InternalServerError:
      description: Error no controlado del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: INTERNAL_SERVER_ERROR
              message: Error interno del servidor.
